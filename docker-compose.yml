services:
  romarr:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: romarr
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DATA_DIR=/app/data
      - ROMS_DIR=/roms
      - DOWNLOADS_DIR=/downloads
      - OS_STRUCTURE=batocera # Options: batocera, retropie, recalbox, es-de

      # ── Security ────────────────────────────────────────────────────────────
      # Optional: set a fixed API key. If omitted, one is auto-generated on
      # first startup and saved to /app/data/api_key.txt (retrieve with:
      #   docker exec romarr cat /app/data/api_key.txt
      # - ROMARR_API_KEY=change-me-to-a-strong-random-key

      # Optional: enable Fernet at-rest encryption for stored credentials.
      # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # - ROMARR_SECRET_KEY=<fernet-key>

      # CORS: comma-separated origins allowed to call the API from a browser.
      # Use the host+port where your browser opens the UI.
      - ROMARR_CORS_ORIGINS=http://localhost:8000,http://localhost:5173

      # Log level: DEBUG | INFO | WARNING | ERROR
      - LOG_LEVEL=INFO

    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/data
      - ./roms:/roms                 # Mount to your Batocera/RetroPie ROMs drive (e.g. /media/batocera/roms)
      - /media/usb_HDD_2TB/romarr_downloads:/downloads       # Shared download folder with your existing qBittorrent
